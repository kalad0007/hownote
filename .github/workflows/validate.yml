name: Validate HowNote

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check smoke-test syntax
        run: node --check scripts/smoke-production.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Verify routes, links and canonical host
        run: npm run verify
