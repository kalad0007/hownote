name: Smoke HowNote production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hownote-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Wait for the exact Cloudflare deployment and verify production
        env:
          HOWNOTE_BASE_URL: https://hownote.net
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_ATTEMPTS: 30
          SMOKE_INTERVAL_MS: 12000
          SMOKE_TIMEOUT_MS: 5000
        run: node scripts/smoke-production.mjs
